name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only throwaway values
      DATABASE_URL_OWNER: postgres://neondb_owner:neondb_owner_local@localhost:5432/client_dashboard_test
      DATABASE_URL_TENANT: postgres://app_tenant:app_tenant_ci@localhost:5432/client_dashboard_test
      DATABASE_URL_SYSTEM: postgres://app_system:app_system_ci@localhost:5432/client_dashboard_test
      APP_TENANT_PASSWORD: app_tenant_ci
      APP_SYSTEM_PASSWORD: app_system_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Init Postgres roles and databases
        run: psql -v ON_ERROR_STOP=1 -f docker/postgres-init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres_ci
      - name: Log Postgres version
        run: psql -c "select version()"
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres_ci
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build .

  # Prod release: migrate Neon first, then deploy to Vercel. If migrate fails
  # the job stops there and nothing is deployed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, docker]
    runs-on: ubuntu-latest
    # Prod secrets live in this environment, whose branch policy allows only
    # main, so a workflow edited on another branch can't read them.
    environment: production
    # Queue deploys instead of cancelling one mid-migration.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Includes devDependencies: the Vercel CLI is an exact-pinned one, so the
      # lockfile pins the whole tree that later receives VERCEL_TOKEN.
      - run: pnpm install --frozen-lockfile
      # Each step gets only the secrets it needs. GitHub masks secret values in
      # logs; commands reference them as env vars, never inline.
      - name: Migrate prod database
        run: pnpm db:migrate
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          APP_TENANT_PASSWORD: ${{ secrets.APP_TENANT_PASSWORD }}
          APP_SYSTEM_PASSWORD: ${{ secrets.APP_SYSTEM_PASSWORD }}
      - name: Pull Vercel production settings
        run: pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build for Vercel
        run: pnpm exec vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Vercel production
        run: pnpm exec vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
