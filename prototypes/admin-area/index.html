<!--
  PROTOTYPE, throwaway: three variants of the Admin area, switchable via ?variant=A|B|C
  Also ?theme=light|dark (default follows system). All mutations are in-memory stubs; reload resets.
  Answers: what screens and flows does the Admin use to manage Clients, Client Users, Projects/boards,
  Invoices and the Requests inbox, and what is a list versus a detail view?
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin area prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (DESIGN.md 2.1 / 2.2, not forked) ---------- */
:root{
  --bg:#F4F4F2;--surface:#FFFFFF;--surface-2:#EFEFEC;--surface-3:#DBDBD6;--fg:#161614;--fg-2:#5E5E58;
  --line:#E3E3DF;--line-strong:#C6C6C0;--line-input:#85857E;--accent:#0F766E;--accent-hover:#115E59;
  --accent-subtle:#D5EFEC;--accent-fg:#0B5F58;--on-accent:#FFFFFF;
  --ok:#467210;--ok-subtle:#ECF5DA;--risk:#A84D08;--risk-subtle:#FDF1DE;--off:#C81E1E;--off-subtle:#FDE7E7;
  --done:#6D28D9;--done-subtle:#EFE7FD;--idle:#57574F;--idle-subtle:#EEEEEA;
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0B;--surface:#151513;--surface-2:#1D1D1B;--surface-3:#2F2F2C;--fg:#ECECE8;--fg-2:#9C9C95;
    --line:#272724;--line-strong:#3B3B37;--line-input:#66665F;--accent:#2DD4BF;--accent-hover:#5EEAD4;
    --accent-subtle:#0F2E2B;--accent-fg:#5EEAD4;--on-accent:#04201D;
    --ok:#A3E635;--ok-subtle:#1E2A0B;--risk:#FBBF24;--risk-subtle:#2E2408;--off:#F87171;--off-subtle:#341313;
    --done:#B794F6;--done-subtle:#241A3A;--idle:#A3A39C;--idle-subtle:#1F1F1C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0B;--surface:#151513;--surface-2:#1D1D1B;--surface-3:#2F2F2C;--fg:#ECECE8;--fg-2:#9C9C95;
  --line:#272724;--line-strong:#3B3B37;--line-input:#66665F;--accent:#2DD4BF;--accent-hover:#5EEAD4;
  --accent-subtle:#0F2E2B;--accent-fg:#5EEAD4;--on-accent:#04201D;
  --ok:#A3E635;--ok-subtle:#1E2A0B;--risk:#FBBF24;--risk-subtle:#2E2408;--off:#F87171;--off-subtle:#341313;
  --done:#B794F6;--done-subtle:#241A3A;--idle:#A3A39C;--idle-subtle:#1F1F1C;color-scheme:dark;
}
/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/20px var(--sans);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a,.lnk{color:var(--accent-fg);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.r,.t .r{text-align:right}
.meta{font:12px/16px var(--mono);color:var(--fg-2)}
.muted{color:var(--fg-2)}
.help{font-size:13px;color:var(--fg-2);margin:0}
.ico{width:12px;height:12px;flex:none;vertical-align:-1px}
.micro{font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:12px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:14px;font-weight:600}
.brand small{font:12px/16px var(--mono);text-transform:uppercase;color:var(--fg-2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:8px}
.nav .sec{padding:12px 8px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;font-size:13px;color:var(--fg-2);cursor:pointer;background:none;border:0;text-align:left;width:100%;min-width:0}
.ni span.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni:hover{background:var(--surface-2);color:var(--fg)}
.ni.on{background:var(--surface-2);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.ni .ct{margin-left:auto;font:12px var(--mono);color:var(--fg-2)}
.ni .dot{margin-left:auto;color:var(--off);display:inline-flex}
.ni.add{color:var(--accent-fg)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
.av{width:24px;height:24px;border-radius:3px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
main{min-width:0;padding:16px 20px 120px;max-width:1280px;width:100%}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.crumb{font:12px/16px var(--mono);text-transform:uppercase;color:var(--fg-2)}
.crumb button{font:inherit;text-transform:inherit;color:var(--accent-fg);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
h1{font-size:18px;line-height:24px;font-weight:600;margin:2px 0 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
/* ---------- Panels, tables ---------- */
.panel{border:1px solid var(--line);border-radius:3px;background:var(--surface);min-width:0;margin-bottom:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.pb{padding:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--surface-2);font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);text-align:left;padding:6px 12px;white-space:nowrap}
.t td{border-top:1px solid var(--line);padding:8px 12px;vertical-align:top}
.t tr.lk{cursor:pointer}
.t tr.lk:hover td{background:var(--surface-2)}
.t tr.sel td{background:var(--accent-subtle)}
.t td.rowacts{text-align:right;white-space:nowrap}
.t td.rowacts .btn{margin-left:4px}
.t .strong{font-weight:600}
.empty{padding:20px 12px;color:var(--fg-2);font-size:13px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--fg-2)}
dl.kv dd{margin:0;min-width:0}
/* ---------- Badges, status ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--hc);color:var(--hc);background:var(--hb);border-radius:3px;padding:1px 6px;font-size:12px;line-height:16px;font-weight:500}
.rs{display:inline-flex;align-items:center;gap:6px;font:12px/16px var(--mono);white-space:nowrap}
.rk{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.tag{display:inline-block;border:1px solid var(--line-strong);border-radius:3px;padding:0 6px;font-size:12px;line-height:18px;color:var(--fg-2);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent-fg);background:var(--accent-subtle)}
.bar{height:4px;background:var(--surface-3);border-radius:1px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;transform-origin:left;background:var(--hc)}
/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:3px;background:var(--surface);margin-bottom:16px}
.kpi{padding:10px 12px;border-left:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;font:inherit;color:inherit}
.kpi:first-child{border-left:0}
button.kpi{cursor:pointer}
button.kpi:hover{background:var(--surface-2)}
.kpi .v{font:500 20px/28px var(--mono);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.kpi .v.bad{color:var(--off)}
/* ---------- Buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:3px;font-weight:500;font-size:13px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--off)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{background:var(--surface-2);color:var(--fg-2);border-color:var(--line);cursor:not-allowed;transform:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.l{font-size:13px;line-height:18px;font-weight:600}
.opt{font-weight:400;color:var(--fg-2)}
.in{width:100%;background:var(--bg);border:1px solid var(--line-input);border-radius:3px;padding:0 10px;height:36px;font-size:14px;color:var(--fg);min-width:0}
.in:hover{border-color:var(--fg-2)}
.in:focus{border-color:var(--accent)}
.in:disabled{background:var(--surface-2);color:var(--fg-2)}
textarea.in{height:auto;min-height:88px;padding:8px 10px;resize:vertical;line-height:20px}
select.in{padding-right:24px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb{display:flex;flex-direction:column;gap:16px;padding:16px}
.ff{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ferr{margin-right:auto;color:var(--off);font-size:13px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:6px;align-items:center}
.lihead{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:6px}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.maptbl select{min-width:150px}
.note{border-left:2px solid var(--accent);padding:6px 10px;background:var(--accent-subtle);font-size:13px;border-radius:0 3px 3px 0}
.warn{border-left:2px solid var(--risk);padding:6px 10px;background:var(--risk-subtle);font-size:13px;border-radius:0 3px 3px 0;color:var(--fg)}
/* ---------- Tabs (variant A) ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 12px;font-size:13px;border:0;background:none;color:var(--fg-2);cursor:pointer;box-shadow:inset 0 -2px 0 transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .ct{font:12px var(--mono);margin-left:4px;color:var(--fg-2)}
/* ---------- Filter bar (variant B) ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.filters .in{width:auto;height:30px;font-size:13px}
/* ---------- Split pane (variant C) ---------- */
.split{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.split>.left{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow-y:auto}
.it{display:block;width:100%;text-align:left;padding:8px 12px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;color:var(--fg);font-size:13px}
.it:first-child{border-top:0}
.it:hover{background:var(--surface-2)}
.it.on{background:var(--accent-subtle);box-shadow:inset 2px 0 0 var(--accent)}
.it .t1{display:flex;gap:6px;align-items:center;justify-content:space-between}
.it .t1 .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.grp{padding:8px 12px 4px;background:var(--surface-2);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.grp:first-child{border-top:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--fg-2)}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chip.on{border-color:var(--accent);color:var(--accent-fg);background:var(--accent-subtle)}
.pane-empty{padding:48px 16px;text-align:center;color:var(--fg-2)}
/* ---------- Drawer, dialog, toast ---------- */
#drawer[hidden]{display:none}
#drawer .bk{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:50;animation:fade .2s}
#drawer .dp{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;animation:slide .24s cubic-bezier(.2,0,0,1)}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
#drawer .dh h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
#drawer form{display:flex;flex-direction:column;flex:1;min-height:0}
#drawer .fb{flex:1;overflow-y:auto}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
dialog#cfm{border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--fg);padding:0;width:420px;max-width:calc(100vw - 24px);box-shadow:0 10px 30px rgb(0 0 0/.18)}
dialog#cfm::backdrop{background:rgb(0 0 0/.45)}
dialog#cfm h2{font-size:14px;margin:0;padding:16px 16px 0}
dialog#cfm .cb{padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
#toast{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgb(0 0 0/.18);max-width:360px}
#toast[hidden]{display:none}
.flash td,.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-subtle)}to{background:transparent}}
/* ---------- Prototype switcher (deliberately not the design) ---------- */
#proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;align-items:center;gap:8px;font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;max-width:calc(100vw - 16px)}
#proto .pill{display:flex;align-items:center;gap:2px;background:#111;color:#fff;border:2px solid #ffd400;border-radius:999px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#proto button{background:transparent;color:#fff;border:0;font:inherit;cursor:pointer;padding:8px 10px;border-radius:999px;white-space:nowrap}
#proto button:hover{background:#333}
#proto button:focus-visible{outline:2px solid #ffd400}
#proto .lbl{padding:0 8px;white-space:nowrap;font-weight:700}
#proto .sep{width:1px;height:20px;background:#555;margin:0 2px}
#proto .st{background:#111;color:#eee;border:2px solid #ffd400;border-radius:10px;padding:10px 12px;width:440px;max-width:calc(100vw - 16px);max-height:50vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:12px}
#proto .st[hidden]{display:none}
#proto .st h4{margin:0 0 6px;color:#ffd400;font-size:12px}
#proto .st ol{margin:0 0 8px;padding-left:18px}
#proto .st code{color:#9fe}
/* ---------- Mobile (tolerable) ---------- */
@media (max-width:767px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:8px 12px}
  .nav{flex-direction:row;overflow-x:auto;padding:0 4px;scrollbar-width:none}
  .nav .sec,.me,.ni .ct,.ni .dot{display:none}
  .ni{width:auto;flex:none;min-height:44px;border-radius:0}
  .ni.on{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding:12px 12px 120px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2,.split,.row2{grid-template-columns:1fr}
  .split>.left{position:static;max-height:none}
  .in{font-size:16px;height:44px}
  .btn{min-height:40px}
  .btn.sm{min-height:32px}
  #toast{left:12px;right:12px;bottom:76px}
  #proto .tname{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawer" hidden><div class="bk" data-act="closeDrawer"></div><aside class="dp" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside></div>
<dialog id="cfm"><form method="dialog"><h2 id="cfT"></h2><div class="cb"><div id="cfX"></div><div id="cfF"></div></div><div class="ff"><button value="cancel" class="btn">Cancel</button><button value="ok" id="cfOk" class="btn pri">OK</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<div id="proto" aria-label="Prototype switcher (not part of the design)">
  <div class="st" id="stPanel" hidden></div>
  <div class="pill">
    <button id="prev" title="Previous variant (←)" aria-label="Previous variant">←</button>
    <span class="lbl" id="lbl"></span>
    <button id="next" title="Next variant (→)" aria-label="Next variant">→</button>
    <span class="sep"></span>
    <button id="themeBtn" title="Toggle light/dark"></button>
    <button id="stBtn" aria-expanded="false" title="Show in-memory state and mutation log">state</button>
  </div>
</div>

<script>
// =====================================================================
// Data (in-memory). "Today" is fixed so Overdue / expiry are stable.
// =====================================================================
const TODAY = '2026-10-10';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fD = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return MON[+m - 1] + ' ' + (+d) + (y !== TODAY.slice(0, 4) ? ', ' + y : ''); };
const fTs = ts => ts ? fD(ts.slice(0, 10)) + ' ' + ts.slice(11) : 'never';
const nowTs = () => { const d = new Date(); return TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
let seq = 100; const uid = p => p + (++seq);

const S = {
  clients: [
    { id: 'acme', name: 'Acme Freight', archived: false, created: '2025-02-11' },
    { id: 'mesa', name: 'Mesa Dental Group', archived: false, created: '2025-06-03' },
    { id: 'harbor', name: 'Harbor & Pine', archived: false, created: '2026-10-04' },
    { id: 'bright', name: 'Brightline Studio', archived: true, created: '2024-11-20', archivedOn: '2026-05-30' },
  ],
  users: [
    { id: 'u1', clientId: 'acme', name: 'Dana Whitfield', email: 'dana@acmefreight.com', role: 'Owner', joined: '2025-02-12' },
    { id: 'u2', clientId: 'acme', name: 'Luis Ortega', email: 'luis@acmefreight.com', role: 'Member', joined: '2025-03-01' },
    { id: 'u3', clientId: 'acme', name: 'Kim Nakamura', email: 'kim@acmefreight.com', role: 'Member', joined: '2026-01-15' },
    { id: 'u4', clientId: 'acme', name: 'Rob Feld', email: 'rob@acmefreight.com', role: 'Member', joined: '2025-03-01', removed: true, removedOn: '2026-04-02' },
    { id: 'u5', clientId: 'mesa', name: 'Maya Chen', email: 'maya@mesadental.com', role: 'Owner', joined: '2025-06-04' },
    { id: 'u6', clientId: 'mesa', name: 'Tom Reyes', email: 'tom@mesadental.com', role: 'Member', joined: '2025-07-19' },
    { id: 'u7', clientId: 'bright', name: 'Jo Park', email: 'jo@brightline.studio', role: 'Owner', joined: '2024-11-21' },

const byId = (arr, id) => arr.find(x => x.id === id);
const client = id => byId(S.clients, id);
const board = id => byId(S.boards, id);
const inv = id => byId(S.invoices, id);

const user = id => byId(S.users, id);
const activeUsers = cid => S.users.filter(u => u.clientId === cid && !u.removed);
const owners = cid => activeUsers(cid).filter(u => u.role === 'Owner');
const invAmount = i => i.items.reduce((s, x) => s + (+x.a || 0), 0);
const invSt = i => i.status === 'Open' && i.due < TODAY ? 'Overdue' : i.status;
const inviteSt = i => i.revoked ? 'Revoked' : i.accepted ? 'Accepted' : i.expires < TODAY ? 'Expired' : (i.expires <= addDays(TODAY, 2) ? 'Expiring' : 'Pending');
const openInvites = cid => S.invites.filter(i => (!cid || i.clientId === cid) && !i.revoked && !i.accepted);
const clientBoards = cid => S.boards.filter(b => b.clientId === cid && b.state !== 'unlinked');
const unmapped = b => b.columns.filter(c => !b.map[c]);
const CS = { up: 'Up next', ip: 'In progress', done: 'Done', hidden: 'Not shown' };
const taskClientStatus = t => { const b = board(t.boardId); const m = b.map[t.col]; return m && m !== 'hidden' ? m : null; };
const isTracked = t => t && t.visible && !!taskClientStatus(t);
const clientTasks = cid => S.tasks.filter(t => { const b = board(t.boardId); return b.clientId === cid && b.state === 'linked' && isTracked(t); });
const openBalance = cid => S.invoices.filter(i => (!cid || i.clientId === cid) && (i.status === 'Open')).reduce((s, i) => s + invAmount(i), 0);
const newReqs = cid => S.requests.filter(r => r.status === 'New' && (!cid || r.clientId === cid));
const projName = id => id ? board(id).title : '—';
const nextNumber = year => {
  const used = S.invoices.filter(i => i.num.endsWith('-' + year)).map(i => +i.num.slice(3, 7));
  return 'NL-' + String((used.length ? Math.max(...used) : 0) + 1).padStart(4, '0') + '-' + year;
};
const msProgress = (b, name) => { const ts = S.tasks.filter(t => t.boardId === b.id && t.milestone === name && isTracked(t)); return ts.length ? Math.round(100 * ts.filter(t => taskClientStatus(t) === 'done').length / ts.length) : 0; };

function attention(cid) {
  const out = [];
  const live = c => !client(c).archived;
  S.requests.filter(r => r.status === 'New' && (!cid || r.clientId === cid)).forEach(r =>
    out.push({ grp: 'New Requests', kind: 'request', id: r.id, title: r.title, meta: client(r.clientId).name + ' · ' + r.kind + ' · ' + fD(r.created) }));
  S.invoices.filter(i => invSt(i) === 'Overdue' && (!cid || i.clientId === cid)).forEach(i =>
    out.push({ grp: 'Overdue Invoices', kind: 'invoice', id: i.id, title: i.num + ' · ' + money(invAmount(i)), meta: client(i.clientId).name + ' · due ' + fD(i.due) }));
  if (!cid) S.boards.filter(b => b.state === 'unlinked').forEach(b =>
    out.push({ grp: 'Unlinked GitHub boards', kind: 'board', id: b.id, title: b.title, meta: b.repo + ' · #' + b.num }));
  S.boards.filter(b => b.state === 'linked' && unmapped(b).length && (!cid || b.clientId === cid)).forEach(b =>
    out.push({ grp: 'Unmapped columns', kind: 'board', id: b.id, title: b.title, meta: client(b.clientId).name + ' · ' + unmapped(b).join(', ') }));
  S.boards.filter(b => b.state === 'linked' && b.webhook === 'failing' && (!cid || b.clientId === cid)).forEach(b =>
    out.push({ grp: 'Sync problems', kind: 'board', id: b.id, title: b.title, meta: 'Webhook failing · last synced ' + fTs(b.lastSync) }));
  S.invites.filter(i => ['Expiring', 'Expired'].includes(inviteSt(i)) && live(i.clientId) && (!cid || i.clientId === cid)).forEach(i =>
    out.push({ grp: 'Expiring Invitations', kind: 'team', id: i.clientId, title: i.email, meta: client(i.clientId).name + ' · ' + inviteSt(i).toLowerCase() + ' ' + fD(i.expires) }));
  S.clients.filter(c => !c.archived && !owners(c.id).length && (!cid || c.id === cid)).forEach(c =>
    out.push({ grp: 'Clients with no Owner', kind: 'team', id: c.id, title: c.name, meta: openInvites(c.id).length ? 'Owner Invitation pending' : 'No Invitation sent' }));
  return out;
}

  return table(['Board', ...(o.client ? ['Client'] : []), 'State', 'Health', 'Columns', 'Sync'], list.map(b => {

    return `<tr class="lk ${selRow('board', b.id)}" ${openAttr('board', b.id)}><td><div class="strong">${esc(b.title)}</div><div class="meta">${b.repo} · #${b.num}</div></td>${o.client ? `<td>${b.clientId ? esc(client(b.clientId).name) : '<span class="muted">—</span>'}</td>` : ''}<td>${stateTag(b)}</td><td>${b.state === 'unlinked' ? '' : hBadge(b.health)}</td><td>${b.state === 'unlinked' ? `<span class="meta">${b.columns.length} columns</span>` : um.length ? badge('risk', 'risk-subtle', ICON['at risk'], um.length + ' unmapped') : '<span class="meta">all mapped</span>'}</td><td><div class="meta">${fTs(b.lastSync)}</div>${b.state === 'linked' ? hookBadge(b) : ''}</td></tr>`;
  }), 'No boards.');
}
function clientsTable(list) {
  return table(['Client', 'Owner', 'Users', 'Projects', '>Open balance', 'Attention', 'State'], list.map(c => {
    const ow = owners(c.id), a = attention(c.id).length;
    return `<tr class="lk ${selRow('client', c.id)}" ${openAttr('client', c.id)}><td class="strong">${esc(c.name)}</td><td>${ow.length ? esc(ow.map(u => u.name).join(', ')) : badge('risk', 'risk-subtle', ICON['at risk'], 'No Owner')}</td><td class="num">${activeUsers(c.id).length}${openInvites(c.id).length ? ` <span class="meta">+${openInvites(c.id).length} invited</span>` : ''}</td><td class="num">${clientBoards(c.id).filter(b => b.state === 'linked').length}</td><td class="num r">${money(openBalance(c.id))}</td><td class="num">${a || '<span class="meta">—</span>'}</td><td>${c.archived ? '<span class="tag">Archived</span>' : '<span class="tag acc">Active</span>'}</td></tr>`;
  }), 'No Clients yet.');
}
function attentionTable(items) {
  return table(['Type', 'Item', 'Details'], items.map(a => `<tr class="lk" ${openAttr(a.kind, a.id)}><td class="micro">${a.grp}</td><td class="strong">${esc(a.title)}</td><td class="meta">${esc(a.meta)}</td></tr>`), 'Nothing needs attention.');
}

// =====================================================================
// Shared sections / details. Each detail returns {crumb,title,sub,actions,body}

function teamSection(cid) {
  const c = client(cid), us = activeUsers(cid), nOwn = owners(cid).length, ro = c.archived;
  const removed = S.users.filter(u => u.clientId === cid && u.removed);
  const rows = us.map(u => {
    const last = u.role === 'Owner' && nOwn === 1;
    const why = 'A Client always has at least one Owner';
    const acts = ro ? '' : (u.role === 'Owner' ? btn('Demote to Member', 'demote', u.id, { disabled: last, title: last ? why : '' }) : btn('Promote to Owner', 'promote', u.id)) + btn('Remove', 'removeUser', u.id, { danger: 1, disabled: last, title: last ? why : '' });
    return `<tr><td><div class="strong">${esc(u.name)}</div><div class="meta">${esc(u.email)}</div></td><td>${u.role}${last ? '<div class="meta">last Owner</div>' : ''}</td><td class="num">${fD(u.joined)}</td><td class="rowacts">${acts}</td></tr>`;
  });
  const invs = openInvites(cid).map(i => `<tr><td>${esc(i.email)}</td><td>${i.role}</td><td class="meta">${esc(i.by)}</td><td class="num">${fD(i.sent)}</td><td class="num">${fD(i.expires)}</td><td>${inviteTag(i)}</td><td class="rowacts">${ro ? '' : btn('Resend', 'resendInv', i.id) + btn('Revoke', 'revokeInv', i.id, { danger: 1 }) + btn('(sim) accept', 'simAccept', i.id, { title: 'Prototype only: pretend the invitee signed in' })}</td></tr>`);
  const first = !nOwn;
  return panel('Client Users', (ro ? '<div class="pb"><div class="warn">Archived: these Client Users cannot sign in. Nothing was deleted.</div></div>' : first ? `<div class="pb"><div class="warn">No Owner yet. ${openInvites(cid).length ? 'Waiting for the Owner Invitation to be accepted.' : 'Invite the first user; they become the Owner.'}</div></div>` : '') +
      table(['Name', 'Role', 'Joined', ''], rows, 'No Client Users yet.') +
      (removed.length ? `<div class="pb meta">Removed (soft-deleted, actions stay attributed): ${removed.map(u => esc(u.name) + ' on ' + fD(u.removedOn)).join(', ')}</div>` : ''),
      ro ? '' : fbtn(first ? 'Invite first Owner' : 'Invite', 'inviteUser', { clientId: cid }, { sm: 1, pri: first })) +
    panel('Invitations', table(['Email', 'Role', 'Invited by', 'Sent', 'Expires', 'State', ''], invs, 'No pending Invitations.'), '<span class="meta">expire after 7 days</span>');
}

function clientDetail(cid, full) {
  const c = client(cid), att = attention(cid), lb = clientBoards(cid);
  const ov = kpis([
    { l: 'Client Users', v: activeUsers(cid).length + (owners(cid).length ? '' : ' · no Owner') },
    { l: 'Active projects', v: lb.filter(b => b.state === 'linked').length },

function mappingFields(b) {
  const counts = c => S.tasks.filter(t => t.boardId === b.id && t.col === c).length;

  const ms = b.milestones.map(m => { const p = msProgress(b, m.name); return `<tr><td>${esc(m.name)}</td><td class="num">${fD(m.due)}</td><td style="width:40%"><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(m.name)} progress" style="--hc:var(--${HC[b.health]})"><span style="transform:scaleX(${p / 100})"></span></div></td><td class="num r">${p}%</td></tr>`; });
  const ts = vis.map(t => `<tr><td>${esc(t.title)}</td><td class="meta">${esc(t.col)}</td><td>${CS[taskClientStatus(t)]}</td><td class="meta">${esc(t.milestone || '—')}</td><td class="num">${fD(t.target)}</td></tr>`);

    body: `<div class="grid2">${panel('Sync', `<div class="pb">${sync}</div>`)}${panel('Required GitHub fields', `<div class="pb">${fieldsCheck(b)}</div>`)}</div>`
      + panel(b.state === 'unlinked' ? 'Link to Client' : 'Column mapping', mapping, b.state === 'linked' && unmapped(b).length ? badge('risk', 'risk-subtle', ICON['at risk'], unmapped(b).length + ' unmapped') : '')
      + panel('Milestones (repo milestones)', table(['Milestone', 'Due', 'Progress', '>%'], ms, 'No repo milestones.'))
      + panel('Client-visible Tasks', table(['Task', 'GitHub column', 'Client status', 'Milestone', 'Target'], ts, 'No client-visible Tasks.'), `<span class="meta">${vis.length} visible · ${hidden} hidden</span>`),
  };
}

function requestDetail(id) {
  const r = req(id), t = r.taskId ? task(r.taskId) : null;

    body: `<div class="grid2">${panel('Request', `<div class="pb"><dl class="kv"><dt>Client</dt><dd>${clink(r.clientId)}</dd><dt>Submitter</dt><dd>${esc(user(r.by).name)} <span class="meta">${user(r.by).role}</span></dd><dt>Project</dt><dd>${esc(projName(r.projectId))}</dd><dt>Created</dt><dd class="num">${fD(r.created)}</dd><dt>Linked Task</dt><dd>${linked}</dd></dl><p style="margin:12px 0 0;white-space:pre-wrap">${esc(r.desc) || '<span class="muted">No description.</span>'}</p></div>`)}

// =====================================================================
// Forms (drawer in A/B, inline pane in C; triage/linkBoard can embed)
// =====================================================================
const field = (label, ctrl, opt) => `<div class="field"><label>${label}${opt ? ' <span class="opt">(optional)</span>' : ''}${ctrl}</label></div>`;
const fieldL = (label, ctrl, opt) => `<div class="field"><span class="l">${label}${opt ? ' <span class="opt">(optional)</span>' : ''}</span>${ctrl}</div>`;
const clientOptions = sel => S.clients.filter(c => !c.archived).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
const projectOptions = (cid, sel) => `<option value="">No specific project</option>` + (cid ? clientBoards(cid).map(b => `<option value="${b.id}" ${b.id === sel ? 'selected' : ''}>${esc(b.title)}${b.state === 'past' ? ' (past)' : ''}</option>`).join('') : '');
const lineRow = (d = '', a = '') => `<div class="li"><input class="in" name="li-d" aria-label="Line Item description" placeholder="Description" value="${esc(d)}"><input class="in num r" name="li-a" type="number" min="0" step="0.01" aria-label="Amount (USD)" placeholder="0.00" value="${a}"><button type="button" class="btn ghost sm" data-act="rmLine" aria-label="Remove Line Item">✕</button></div>`;

const FORMS = {
  newClient: () => ({ title: 'New client', submit: 'Create client', body: fieldL('Client name', '<input class="in" name="name" autocomplete="off" placeholder="e.g. Northwind Logistics">') + '<p class="help">Next you invite the first user, who becomes its Owner.</p>' }),
  inviteUser: a => {
    const c = client(a.clientId), first = !owners(c.id).length;
    return { title: first ? 'Invite first Owner' : 'Invite to ' + c.name, submit: 'Send invitation',
      body: `<div class="meta">${esc(c.name.toUpperCase())}</div>` + fieldL('Email', '<input class="in" name="email" type="email" autocomplete="off" placeholder="name@company.com">')
        + (first ? '<input type="hidden" name="role" value="Owner"><div class="note">This Client has no Owner, so this person joins as <b>Owner</b>.</div>'
          : fieldL('Role', '<select class="in" name="role"><option>Member</option><option>Owner</option></select>'))
        + '<p class="help">Expires in 7 days and can be revoked. They must sign in with this exact email. An email can belong to one Client only.</p>' };
  },
  linkBoard: a => {
    const b = a.boardId ? board(a.boardId) : null, unl = S.boards.filter(x => x.state === 'unlinked');
    const boardPick = b ? `<input type="hidden" name="boardId" value="${b.id}"><div><b>${esc(b.title)}</b> <span class="meta">${b.repo} · #${b.num}</span></div>`
      : unl.length ? fieldL('GitHub board', `<select class="in" name="boardId" data-swap="map"><option value="">Choose an unlinked board…</option>${unl.map(x => `<option value="${x.id}">${esc(x.title)} · ${x.repo}</option>`).join('')}</select>`) : '<div class="warn">No unlinked boards in the GitHub org.</div>';
    const clientPick = a.clientId ? `<input type="hidden" name="clientId" value="${a.clientId}"><div class="meta">FOR ${esc(client(a.clientId).name.toUpperCase())}</div>` : fieldL('Client', `<select class="in" name="clientId"><option value="">Choose a Client…</option>${clientOptions()}</select>`);
    return { title: 'Link GitHub board', submit: 'Link board', body: clientPick + boardPick + `<div class="mapwrap">${b ? fieldL('Map columns to client statuses', mappingFields(b)) + (b.fields.vis && b.fields.note && b.fields.target ? '' : '<div class="warn">This board is missing required fields (see Required GitHub fields). Tasks may not show until they exist.</div>') : '<p class="help">Pick a board to map its columns.</p>'}</div>` };
  },
  newInvoice: a => {
    const cid = a.clientId || '';
    return { title: 'New invoice', submit: 'Issue invoice', body:
      fieldL('Client', `<select class="in" name="clientId"><option value="">Choose a Client…</option>${clientOptions(cid)}</select>`)
      + fieldL('Project', `<select class="in" name="projectId">${projectOptions(cid)}</select>`, 1)
      + `<div class="row2">${fieldL('Issue date', `<input class="in" type="date" name="issued" value="${TODAY}">`)}${fieldL('Due date', `<input class="in" type="date" name="due" value="${addDays(TODAY, 30)}">`)}</div>`
      + `<div class="meta">NUMBER WILL BE <b class="numprev">${nextNumber(TODAY.slice(0, 4))}</b></div>`
      + fieldL('Memo', '<textarea class="in" name="memo" rows="2" style="min-height:60px" placeholder="Shown to the Client"></textarea>', 1)
      + `<div class="field"><span class="l">Line Items</span><div class="lihead micro"><span>Description</span><span class="r">Amount</span><span></span></div><div class="lines" style="display:flex;flex-direction:column;gap:6px">${lineRow()}</div><div><button type="button" class="btn sm" data-act="addLine">+ Add Line Item</button></div><div class="total"><span>Total</span><span class="num tot">${money(0)}</span></div></div>` };
  },
  triage: a => {
    const r = req(a.requestId), tasks = clientTasks(r.clientId), canLink = ['Accepted', 'Done'].includes(r.status);
    const cur = r.taskId && !tasks.find(t => t.id === r.taskId) ? task(r.taskId) : null;
    return { embed: true, submit: 'Save triage', body:
      fieldL('Status', `<div class="chips" role="radiogroup">${['New', 'Accepted', 'Declined', 'Done'].map(s => `<label class="chip ${r.status === s ? 'on' : ''}"><input type="radio" name="status" value="${s}" ${r.status === s ? 'checked' : ''} style="position:absolute;opacity:0">${ICON[s]} ${s}</label>`).join('')}</div>`)
      + fieldL('Response note', `<textarea class="in" name="response" placeholder="The Client sees this note.">${esc(r.response)}</textarea>`, 1)
      + fieldL('Linked Task', `<select class="in" name="taskId" ${canLink ? '' : 'disabled'}><option value="">No Task</option>${cur ? `<option value="${cur.id}" selected>${esc(cur.title)} (no longer tracked)</option>` : ''}${tasks.map(t => `<option value="${t.id}" ${t.id === r.taskId ? 'selected' : ''}>${esc(t.title)} · ${esc(board(t.boardId).title)} · ${CS[taskClientStatus(t)]}</option>`).join('')}</select>`, 1)
      + `<p class="help tasknote">${canLink ? `Picker lists ${esc(client(r.clientId).name)}'s client-visible Tasks.` : 'Set status to Accepted to link a Task.'}</p>` };
  },
};

function formHtml(name, a, mode) {
  const f = FORMS[name](a);
  const head = mode === 'inline' ? `<div class="ph"><h2>${esc(f.title)}</h2><button type="button" class="btn ghost sm" data-act="cancelForm">Close</button></div>` : '';
  const cancel = mode === 'embed' ? '' : '<button type="button" class="btn" data-act="cancelForm">Cancel</button>';
  return `<form data-form="${name}" data-args="${J(a)}" novalidate>${head}<div class="fb">${f.body}</div><div class="ff"><span class="ferr" role="alert"></span>${cancel}<button class="btn pri">${f.submit}</button></div></form>`;
}

// =====================================================================
// Mutations (stubs). Each returns an error string to show, or nothing.
// =====================================================================
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
function emailOwner(email) {
  email = email.toLowerCase();
  const u = S.users.find(x => !x.removed && x.email.toLowerCase() === email);
  if (u) return u.clientId;
  const i = S.invites.find(x => !x.revoked && !x.accepted && x.email.toLowerCase() === email && inviteSt(x) !== 'Expired');
  return i ? i.clientId : null;
}
const SUBMIT = {
  newClient(fd) {
    const name = (fd.name || '').trim();
    if (!name) return 'Enter a name.';
    if (S.clients.some(c => c.name.toLowerCase() === name.toLowerCase())) return 'A Client with that name exists.';
    const id = uid('c');
    S.clients.push({ id, name, archived: false, created: TODAY });
    log(`Created Client "${name}"`);
    return { goto: ['team', id], next: ['inviteUser', { clientId: id }] };
  },
  inviteUser(fd, a) {
    const email = (fd.email || '').trim();
    if (!isEmail(email)) return 'Enter a valid email.';
    const owner = emailOwner(email);
    if (owner && owner !== a.clientId) return `That email already belongs to ${client(owner).name}. One email, one Client.`;
    if (owner === a.clientId) return 'That person is already a Client User or invited here.';
    S.invites.push({ id: uid('i'), clientId: a.clientId, email, role: fd.role || 'Member', sent: TODAY, expires: addDays(TODAY, 7), by: 'Admin' });
    log(`Invited ${email} as ${fd.role} to ${client(a.clientId).name} (expires ${fD(addDays(TODAY, 7))})`);
  },
  linkBoard(fd, a, f) {
    const cid = fd.clientId, bid = fd.boardId;
    if (!cid) return 'Choose a Client.';
    if (!bid) return 'Choose a board.';
    const b = board(bid), map = readMap(f);
    Object.assign(b, { clientId: cid, state: 'linked', linkedOn: TODAY, map, lastSync: nowTs(), webhook: 'ok', health: b.health || 'inactive', updated: b.updated || TODAY });
    log(`Linked board "${b.title}" to ${client(cid).name}; ${unmapped(b).length} column(s) unmapped`);
    return { goto: ['board', bid] };
  },
  editMapping(fd, a, f) {
    const b = board(a.boardId); b.map = readMap(f);
    log(`Saved column mapping for "${b.title}": ${b.columns.map(c => c + '→' + (CS[b.map[c]] || 'unmapped')).join(', ')}`);
  },
  newInvoice(fd, a, f) {
    if (!fd.clientId) return 'Choose a Client.';
    if (!fd.issued || !fd.due) return 'Set issue and due dates.';
    if (fd.due < fd.issued) return 'Due date is before the issue date.';
    const items = [...f.querySelectorAll('.li')].map(r => ({ d: r.querySelector('[name=li-d]').value.trim(), a: parseFloat(r.querySelector('[name=li-a]').value) }));
    if (!items.length || items.some(x => !x.d || !(x.a > 0))) return 'Each Line Item needs a description and an amount above $0.';
    const num = nextNumber(fd.issued.slice(0, 4)), id = uid('v');
    S.invoices.push({ id, num, clientId: fd.clientId, projectId: fd.projectId || null, issued: fd.issued, due: fd.due, memo: fd.memo.trim(), items, status: 'Open' });
    log(`Issued ${num} to ${client(fd.clientId).name} for ${money(invAmount(inv(id)))}`);
    return { goto: ['invoice', id] };
  },
  triage(fd, a) {
    const r = req(a.requestId), prev = r.status;
    r.status = fd.status; r.response = (fd.response || '').trim();
    r.taskId = ['Accepted', 'Done'].includes(r.status) ? (fd.taskId || null) : null;
    log(`Request "${r.title}": ${prev} → ${r.status}${r.response ? ', response note saved' : ''}${r.taskId ? ', linked to Task "' + task(r.taskId).title + '"' : ''}`);
  },
};
function readMap(f) { const m = {}; f.querySelectorAll('select[name^="map:"]').forEach(s => { if (s.value) m[s.name.slice(4)] = s.value; }); return m; }

const ACT = {
  promote: id => { const u = user(id); u.role = 'Owner'; log(`Promoted ${u.name} to Owner`); },
  demote: id => { const u = user(id); if (owners(u.clientId).length < 2) return toast('A Client always has at least one Owner.'); u.role = 'Member'; log(`Demoted ${u.name} to Member`); },
  removeUser: id => { const u = user(id); ask({ title: `Remove ${u.name}?`, text: `They lose access to ${client(u.clientId).name} at once. Their past Requests stay attributed to them.`, ok: 'Remove', danger: 1 }, () => { u.removed = true; u.removedOn = TODAY; log(`Removed ${u.name} from ${client(u.clientId).name} (soft-delete)`); render(); }); return 'async'; },
  resendInv: id => { const i = byId(S.invites, id); i.sent = TODAY; i.expires = addDays(TODAY, 7); log(`Resent Invitation to ${i.email}; expires ${fD(i.expires)}`); },
  revokeInv: id => { const i = byId(S.invites, id); ask({ title: 'Revoke Invitation?', text: `The link sent to ${esc(i.email)} stops working.`, ok: 'Revoke', danger: 1 }, () => { i.revoked = true; log(`Revoked Invitation to ${i.email}`); render(); }); return 'async'; },
  simAccept: id => { const i = byId(S.invites, id); i.accepted = true; const nm = i.email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); S.users.push({ id: uid('u'), clientId: i.clientId, name: nm, email: i.email, role: i.role, joined: TODAY }); log(`(sim) ${i.email} accepted; now ${i.role} of ${client(i.clientId).name}`); },
  archive: id => { const c = client(id); ask({ title: `Archive ${c.name}?`, text: `Its ${activeUsers(id).length} Client User(s) lose access. Nothing is deleted: Projects, Invoices and Requests stay.`, ok: 'Archive', danger: 1 }, () => { c.archived = true; c.archivedOn = TODAY; log(`Archived Client ${c.name}`); render(); }); return 'async'; },
  unarchive: id => { const c = client(id); c.archived = false; delete c.archivedOn; log(`Unarchived Client ${c.name}`); },
  syncNow: id => { const b = board(id); b.lastSync = nowTs(); log(`Synced "${b.title}" from GitHub${b.webhook === 'failing' ? ' (webhook still failing; poll succeeded)' : ''}`); },
  unlink: id => { const b = board(id); ask({ title: `Unlink "${b.title}"?`, text: `It becomes a Past Project for ${esc(client(b.clientId).name)}, frozen as it is now. GitHub changes stop flowing in.`, ok: 'Unlink', danger: 1 }, () => { b.state = 'past'; b.frozenOn = TODAY; b.webhook = null; log(`Unlinked "${b.title}"; frozen as a Past Project`); render(); }); return 'async'; },
  markPaid: id => { const i = inv(id); ask({ title: `Mark ${i.num} paid?`, text: `${money(invAmount(i))} from ${esc(client(i.clientId).name)}. Payment happened outside the dashboard.`, ok: 'Mark paid', date: TODAY }, d => { i.status = 'Paid'; i.paidOn = d || TODAY; log(`Marked ${i.num} Paid on ${fD(i.paidOn)}`); render(); }); return 'async'; },
  voidInv: id => { const i = inv(id); ask({ title: `Void ${i.num}?`, text: `Void is final. The number stays used (a gap in the sequence) and Client Users stop seeing it.`, ok: 'Void invoice', danger: 1 }, () => { i.status = 'Void'; i.voidedOn = TODAY; log(`Voided ${i.num}`); render(); }); return 'async'; },
};

    right = `<div class="hdr"><div><div class="crumb">${esc(d.crumb)}</div><h1>${esc(d.title)}</h1><div class="sub">${d.sub}</div></div><div class="acts">${d.actions}</div></div>` + d.body;
  } else right = `<section class="panel"><div class="pane-empty">Select an item on the left.${N.page === 'queue' && att.length ? ' Start with the first: the queue empties as you resolve items.' : ''}</div></section>`;
  const main = `<div class="split"><section class="panel left"><div class="ph"><h2>${title}</h2><div class="acts">${action}</div></div><div class="list">${left}</div></section><div class="rightpane" style="min-width:0">${right}</div></div>`;
  return shell(nav, main);
}

// =====================================================================
// Controller: routing, opening objects, forms, events
// =====================================================================
const ORDER = ['A', 'B', 'C'];
const NAMES = { A: 'Client-centric', B: 'Object-centric', C: 'Queue-first' };
const RENDER = { A: renderA, B: renderB, C: renderC };
const params = new URLSearchParams(location.search);
let variant = ORDER.includes((params.get('variant') || '').toUpperCase()) ? params.get('variant').toUpperCase() : 'A';
let theme = ['light', 'dark'].includes(params.get('theme')) ? params.get('theme') : null; // null = follow system
const app = document.getElementById('app');

function isSelected(kind, id) {
  if (variant === 'C') return NAV.C.sel && NAV.C.sel.kind === kind && NAV.C.sel.id === id;
  return false;
}

function openObj(kind, id) {
  if (variant === 'A') {
    const N = NAV.A;
    if (kind === 'client' || kind === 'team') Object.assign(N, { page: 'client', client: id, tab: kind === 'team' ? 'team' : 'overview', sel: null });
    else if (kind === 'request') { if (N.page === 'inbox') N.sel = id; else Object.assign(N, { page: 'client', client: req(id).clientId, tab: 'requests', sel: id }); }
    else if (kind === 'invoice') Object.assign(N, { page: 'client', client: inv(id).clientId, tab: 'invoices', sel: id });
    else if (kind === 'board') { const b = board(id); if (!b.clientId) Object.assign(N, { page: 'home', client: null, sel: id }); else Object.assign(N, { page: 'client', client: b.clientId, tab: 'boards', sel: id }); }
  } else if (variant === 'B') {
    const page = { client: 'clients', team: 'clients', request: 'requests', invoice: 'invoices', board: 'boards' }[kind];
    Object.assign(NAV.B, { page, detail: id });
  } else {
    const k = kind === 'team' ? 'client' : kind;
    if (NAV.C.page !== 'queue') NAV.C.page = { client: 'clients', request: 'requests', invoice: 'invoices', board: 'boards' }[k];
    if (k === 'request' && NAV.C.page === 'requests' && NAV.C.filter !== 'All' && req(id).status !== NAV.C.filter) NAV.C.filter = 'All';
    Object.assign(NAV.C, { sel: { kind: k, id }, form: null });
  }
  render(); window.scrollTo(0, 0);
}

function showForm(name, args) {
  if (variant === 'C') { NAV.C.form = { name, args }; render(); focusFirst(app.querySelector('.rightpane form')); return; }
  const dp = document.querySelector('#drawer .dp');
  dp.innerHTML = `<div class="dh"><h2 id="drawerTitle">${esc(FORMS[name](args).title)}</h2><button class="btn ghost" data-act="closeDrawer" aria-label="Close">✕</button></div>` + formHtml(name, args, 'drawer');
  document.getElementById('drawer').hidden = false;
  focusFirst(dp.querySelector('form'));
}
function focusFirst(f) { const el = f && f.querySelector('input:not([type=hidden]),select,textarea'); if (el) el.focus(); }
function closeDrawer() { document.getElementById('drawer').hidden = true; document.querySelector('#drawer .dp').innerHTML = ''; }
function closeForm(f) { if (f && f.closest('#drawer')) closeDrawer(); else if (variant === 'C' && NAV.C.form) { NAV.C.form = null; } }

function log(msg) {
  S.log.push({ at: new Date().toLocaleTimeString(), msg });
  console.log('[mutation]', msg, JSON.parse(JSON.stringify({ clients: S.clients, users: S.users, invites: S.invites, boards: S.boards.map(({ id, state, clientId, map, lastSync }) => ({ id, state, clientId, map, lastSync })), invoices: S.invoices, requests: S.requests })));
  toast(msg); renderState();
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 4000); }

function ask(o, cb) {
  const d = document.getElementById('cfm');
  document.getElementById('cfT').textContent = o.title;
  document.getElementById('cfX').innerHTML = o.text;
  document.getElementById('cfF').innerHTML = o.date ? `<div class="field"><span class="l">Paid on</span><input class="in" type="date" id="cfDate" value="${o.date}"></div>` : '';
  const ok = document.getElementById('cfOk'); ok.textContent = o.ok; ok.className = 'btn ' + (o.danger ? 'danger' : 'pri');
  d.returnValue = '';
  d.onclose = () => { if (d.returnValue === 'ok') cb(o.date ? document.getElementById('cfDate').value : undefined); };
  d.showModal();
}

function render() {
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  app.innerHTML = RENDER[variant]();
  document.getElementById('lbl').textContent = `${variant} · ${NAMES[variant]}`;
  const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('themeBtn').innerHTML = dark ? '☾<span class="tname"> dark</span>' : '☀<span class="tname"> light</span>';
  document.title = `PROTOTYPE · Admin ${variant} · ${NAMES[variant]}`;
  const p = new URLSearchParams(location.search); p.set('variant', variant); theme ? p.set('theme', theme) : p.delete('theme');
  history.replaceState(null, '', location.pathname + '?' + p.toString() + location.hash);
  renderState();
}
function renderState() {
  const el = document.getElementById('stPanel'); if (el.hidden) return;
  el.innerHTML = `<h4>In-memory state (reload resets)</h4>
    <div>Clients ${S.clients.length} (${S.clients.filter(c => c.archived).length} archived) · Users ${S.users.filter(u => !u.removed).length} · open Invitations ${openInvites().length}<br>
    Boards linked ${S.boards.filter(b => b.state === 'linked').length} / unlinked ${S.boards.filter(b => b.state === 'unlinked').length} / past ${S.boards.filter(b => b.state === 'past').length}<br>
    Invoices ${S.invoices.length} · next <code>${nextNumber(TODAY.slice(0, 4))}</code> · Requests New ${newReqs().length} · attention ${attention().length}<br>
    nav <code>${esc(JSON.stringify(NAV[variant]))}</code></div>
    <h4 style="margin-top:8px">Mutation log</h4>${S.log.length ? `<ol>${S.log.slice().reverse().map(l => `<li>${l.at} ${esc(l.msg)}</li>`).join('')}</ol>` : '<div>none yet</div>'}`;
}
function step(d) { variant = ORDER[(ORDER.indexOf(variant) + d + ORDER.length) % ORDER.length]; closeDrawer(); render(); }

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('themeBtn').onclick = () => { const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; theme = dark ? 'light' : 'dark'; render(); };
document.getElementById('stBtn').onclick = e => { const p = document.getElementById('stPanel'); p.hidden = !p.hidden; e.currentTarget.setAttribute('aria-expanded', !p.hidden); renderState(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('drawer').hidden) { closeDrawer(); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  if (el && (el.matches('input, textarea, select') || el.isContentEditable)) return;
  if (document.getElementById('cfm').open || !document.getElementById('drawer').hidden) return;
  step(e.key === 'ArrowLeft' ? -1 : 1);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.closest('#proto')) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'go') { Object.assign(NAV[variant], JSON.parse(el.dataset.to)); render(); window.scrollTo(0, 0); return; }
  if (a === 'open') { openObj(el.dataset.kind, id); return; }
  if (a === 'csel') { NAV.C.sel = { kind: el.dataset.kind === 'team' ? 'client' : el.dataset.kind, id }; NAV.C.form = null; render(); return; }
  if (a === 'cform') { showForm(id, {}); return; }
  if (a === 'form') { e.stopPropagation(); showForm(el.dataset.formName, JSON.parse(el.dataset.args || '{}')); return; }
  if (a === 'closeDrawer') { closeDrawer(); return; }
  if (a === 'cancelForm') { const f = el.closest('form'); closeForm(f); if (!f.closest('#drawer')) render(); return; }
  if (a === 'addLine') { el.closest('.field').querySelector('.lines').insertAdjacentHTML('beforeend', lineRow()); recalc(el.closest('form')); el.closest('.field').querySelector('.lines .li:last-child input').focus(); return; }
  if (a === 'rmLine') { const f = el.closest('form'); if (f.querySelectorAll('.li').length > 1) el.closest('.li').remove(); recalc(f); return; }
  if (ACT[a]) { e.stopPropagation(); const r = ACT[a](id); if (r !== 'async') render(); }
});

// Live behaviours inside forms
function recalc(f) {
  if (!f || f.dataset.form !== 'newInvoice') return;
  const sum = [...f.querySelectorAll('[name=li-a]')].reduce((s, i) => s + (parseFloat(i.value) || 0), 0);
  f.querySelector('.tot').textContent = money(sum);
  const iss = f.querySelector('[name=issued]').value; if (iss) f.querySelector('.numprev').textContent = nextNumber(iss.slice(0, 4));
  const rms = f.querySelectorAll('[data-act=rmLine]'); rms.forEach(b => b.disabled = rms.length === 1);
}
document.addEventListener('input', e => recalc(e.target.form));
document.addEventListener('change', e => {
  const t = e.target, f = t.form;
  if (t.matches('[data-filter]')) { NAV.B[t.dataset.filter] = t.value; render(); return; }
  if (!f) return;
  if (f.dataset.form === 'newInvoice' && t.name === 'clientId') f.querySelector('[name=projectId]').innerHTML = projectOptions(t.value);
  if (f.dataset.form === 'linkBoard' && t.dataset.swap === 'map') { const b = board(t.value); f.querySelector('.mapwrap').innerHTML = b ? `<div class="field"><span class="l">Map columns to client statuses</span>${mappingFields(b)}</div>` : ''; }
  if (f.dataset.form === 'triage' && t.name === 'status') {
    f.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
    const can = ['Accepted', 'Done'].includes(t.value), sel = f.querySelector('[name=taskId]');
    sel.disabled = !can; if (!can) sel.value = '';
    f.querySelector('.tasknote').textContent = can ? 'Picker lists this Client\'s client-visible Tasks.' : 'Set status to Accepted to link a Task.';
  }
  recalc(f);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const a = JSON.parse(f.dataset.args || '{}');
  const fd = Object.fromEntries(new FormData(f));
  const res = SUBMIT[f.dataset.form](fd, a, f);
  if (typeof res === 'string') { f.querySelector('.ferr').textContent = res; return; }
  closeForm(f);
  if (res && res.goto && f.dataset.form !== 'triage') openObj(res.goto[0], res.goto[1]); else render();
  if (res && res.next) showForm(res.next[0], res.next[1]);
});
document.addEventListener('focusin', e => { if (e.target.closest && e.target.closest('form[data-form=newInvoice]')) recalc(e.target.closest('form')); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!theme) render(); });

render();
</script>
</body>
